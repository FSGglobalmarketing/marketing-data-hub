document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

00);\n  }\n\n  applyFilter() {\n    if (!this.map) return;\n    const { brand, channel, strategy } = this.state;\n    this.markers.forEach(m => {\n      const c = m._c;\n      const show = (brand==='all'||c.brand===brand) && (channel==='all'||c.channel===channel) && (strategy==='all'||c.strategy===strategy);\n      if (show) { if (!this.map.hasLayer(m)) m.addTo(this.map); if (m._hasPopup) m.openPopup(); }\n      else if (this.map.hasLayer(m)) this.map.removeLayer(m);\n    });\n  }\n\n  setFilter(dim, val) { this.setState({ [dim]: val }); }\n  openMenuId(id) { this.setState(s => ({ openMenu: s.openMenu === id ? null : id })); }\n  closeMenu() { this.setState({ openMenu:null }); }\n  toggleDate() { this.setState(s => ({ dateOpen: !s.dateOpen })); }\n\n  countFor(dim, id) {\n    if (id === 'all') return this.campaigns.length;\n    return this.campaigns.filter(c => c[dim] === id).length;\n  }\n\n  buildMenu() {\n    const kind = this.state.openMenu;\n    if (!kind || kind === 'layers') return { title:'', options:[] };\n    const map = { brand:{ defs:this.brandDefs, dim:'brand', title:'FILTER BY BRAND' },\n                  channel:{ defs:this.channelDefs, dim:'channel', title:'FILTER BY CHANNEL' },\n                  strategy:{ defs:this.strategyDefs, dim:'strategy', title:'FILTER BY STRATEGY' } }[kind];\n    const cur = this.state[map.dim];\n    const options = map.defs.map(d => {\n      const active = d.id === cur;\n      const count = this.countFor(map.dim, d.id);\n      return {\n        label:d.label, mono:d.mono, count,\n        onClick: () => this.setFilter(map.dim, d.id),\n        rowStyle:'display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:10px;cursor:pointer;'+(active?'background:rgba(244,173,68,.15);':''),\n        monoStyle:'width:30px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex:none;letter-spacing:.02em;'+(active?'background:#f4ad44;color:#0c1f39;':'background:rgba(255,255,255,.09);color:#cdd9e6;'),\n        labelStyle:'font-size:12px;font-weight:'+(active?'600':'400')+';color:'+(active?'#fff':'#cdd9e6')+';white-space:nowrap;overflow:hidden;text-overflow:ellipsis',\n        countStyle:'margin-left:auto;font-size:10.5px;font-variant-numeric:tabular-nums;color:'+(active?'#f4ad44':'#7e93ac')\n      };\n    });\n    return { title:map.title, options };\n  }\n\n  buildLayers() {\n    const rows = [\n      { c:'#f4ad44', label:'Active campaigns' },\n      { c:'#5ec8e6', label:'Share of voice growing' },\n      { c:'#9db2cc', label:'Competitor activity' }\n    ];\n    return rows.map(r => ({\n      label:r.label, mono:'', count:'',\n      onClick: () => {},\n      rowStyle:'display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:10px',\n      monoStyle:'width:12px;height:12px;border-radius:50%;flex:none;background:'+r.c+';box-shadow:0 0 8px '+r.c,\n      labelStyle:'font-size:12px;color:#cdd9e6;white-space:nowrap',\n      countStyle:'display:none'\n    }));\n  }\n\n  iconStyle(id) {\n    const open = this.state.openMenu === id;\n    return 'position:relative;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;'\n      + (open ? 'background:rgba(242,163,60,.16);border:1px solid rgba(242,163,60,.35);color:#f4ad44;' : 'border:1px solid transparent;color:#9fb3cc;');\n  }\n  dotStyle(dim) {\n    const on = this.state[dim] !== 'all';\n    return 'position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:#f4ad44;box-shadow:0 0 6px #f4ad44;'+(on?'display:block':'display:none');\n  }\n\n  buildPresets() {\n    const items = ['Today','Last 7 days','Last 28 days','This quarter','Last quarter','This year','Custom range'];\n    return items.map(label => ({\n      label, onClick: () => this.toggleDate(),\n      style:'font-size:11.5px;padding:7px 9px;border-radius:8px;cursor:pointer;'+(label==='This quarter'?'background:rgba(244,173,68,.15);color:#f4ad44;font-weight:600;':'color:#cdd9e6;')\n    }));\n  }\n  buildCal() {\n    const firstDow = new Date(2026,2,1).getDay();\n    const cells = [];\n    for (let i=0;i<firstDow;i++) cells.push({ n:'', style:'height:26px' });\n    for (let d=1;d<=31;d++) cells.push({ n:d, style:'height:26px;display:flex;align-items:center;justify-content:center;font-size:11px;border-radius:6px;'+(d===31?'background:#f4ad44;color:#0c1f39;font-weight:700;':'background:rgba(244,173,68,.13);color:#e6edf4;') });\n    return { name:'March 2026', cells };\n  }\n\n  renderVals() {\n    const menu = this.state.openMenu === 'layers' ? { title:'MAP LAYERS', options:this.buildLayers() } : this.buildMenu();\n    return {\n      mapRef: this.mapRef,\n      openMenu: !!this.state.openMenu,\n      menuTitle: menu.title,\n      menuOptions: menu.options,\n      openBrand: () => this.openMenuId('brand'),\n      openChannel: () => this.openMenuId('channel'),\n      openStrategy: () => this.openMenuId('strategy'),\n      openLayers: () => this.openMenuId('layers'),\n      closeMenu: () => this.closeMenu(),\n      brandIconStyle: this.iconStyle('brand'),\n      channelIconStyle: this.iconStyle('channel'),\n      strategyIconStyle: this.iconStyle('strategy'),\n      layersIconStyle: this.iconStyle('layers'),\n      brandDotStyle: this.dotStyle('brand'),\n      channelDotStyle: this.dotStyle('channel'),\n      strategyDotStyle: this.dotStyle('strategy'),\n      presets: this.buildPresets(),\n      cal: this.buildCal(),\n      dateOpen: this.state.dateOpen,\n      rangeLabel: '1 Jan – 31 Mar 2026',\n      toggleDate: () => this.toggleDate(),\n      zoomIn: () => this.map && this.map.zoomIn(0.6),\n      zoomOut: () => this.map && this.map.zoomOut(0.6),\n      resetView: () => this.map && this.map.setView([26,64], 2.6)\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
