<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marketing Data Hub — First Sentier Group</title>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="design-system/tokens.css?v=14">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <style>
    html, body { height: 100%; }
    #frame { position: relative; width: 100vw; height: 100vh; overflow: hidden;
             background: var(--ds-bg-frame); }
    .region { position: absolute; }
    .hairline { height: 1px; background: var(--ds-hairline); margin: 4px 2px; }
    .rail-tbtn { position: relative; width: 40px; height: 40px; border-radius: var(--ds-r-md);
                 display: flex; align-items: center; justify-content: center; border: 1px solid transparent; }
    .rail-dot { position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%;
                background: var(--ds-accent); box-shadow: 0 0 6px var(--ds-accent); display: none; }
    .leaflet-popup-content-wrapper { padding: 0; }
    #rail-row1 { display: grid; grid-template-columns: 1.7fr 1fr 1fr 1fr; gap: 11px; }
    #rail-row2 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 11px; }
    #rail-row1 > div, #rail-row2 > div { min-height: 0; }
    /* page fade transition */
    body { animation: dh-fadein .3s ease both; }
    @keyframes dh-fadein { from { opacity: 0 } to { opacity: 1 } }
    body.dh-fadeout { opacity: 0 !important; transition: opacity .24s ease; }
    /* activity pin tooltip (hover) + popup (click) share the tip-* content */
    .leaflet-tooltip.ds-tip { background: var(--ds-glass-fill-strong); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,.16); border-radius: 13px; color: var(--ds-ink-1); box-shadow: var(--ds-shadow-pop);
      padding: 15px 18px; width: 300px; min-width: 300px; max-width: 320px; white-space: normal; font-family: var(--ds-font-sans); }
    .leaflet-tooltip.ds-tip::before { display: none; }
    .ds-pop .leaflet-popup-content { width: 264px !important; min-width: 264px; }
    .tip-t { font-size: 15px; font-weight: 600; color: var(--ds-ink-1); margin-bottom: 12px; line-height: 1.3; }
    .tip-row { display: flex; align-items: baseline; justify-content: space-between; gap: 18px; font-size: 12.5px; padding: 5px 0; line-height: 1.4; }
    .tip-row span { color: var(--ds-ink-5); white-space: nowrap; }
    .tip-row b { color: var(--ds-ink-1); font-weight: 600; text-align: right; }
    .tip-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .tip-head .tip-t { margin-bottom: 12px; }
    .tip-go { flex: none; display: flex; color: var(--ds-ink-5); cursor: pointer; transition: color .15s ease; }
    .tip-go:hover { color: var(--ds-accent); }
    /* cluster → scrollable glass grid of activity cards */
    .ds-cluster-pop .leaflet-popup-content-wrapper { background: var(--ds-glass-fill-strong); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,.16); border-radius: 14px; box-shadow: var(--ds-shadow-pop); color: var(--ds-ink-1); }
    .ds-cluster-pop .leaflet-popup-content { width: 300px !important; margin: 15px; }
    .ds-cluster-pop .leaflet-popup-tip { background: var(--ds-glass-fill-strong); border: 1px solid rgba(255,255,255,.16); }
    .ds-cluster-pop a.leaflet-popup-close-button { color: var(--ds-ink-4); }
    .cluster-grid { max-height: 300px; overflow-y: auto; display: grid; gap: 15px; padding-right: 4px; }
    .cluster-grid::-webkit-scrollbar { width: 7px; }
    .cluster-grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 4px; }
    .tip-card { background: rgba(255,255,255,.05); border: 1px solid var(--ds-hairline); border-radius: 11px; padding: 12px 13px; }
    .tip-card .tip-t { margin-bottom: 9px; }
    /* numbered cluster pin */
    .ds-cluster-wrap { background: transparent; border: 0; }
    .ds-cluster { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-family: var(--ds-font-sans); font-weight: 600; font-size: 13px; color: #0c1f39; background: var(--ds-accent);
      box-shadow: 0 0 0 6px rgba(244,173,68,.22), 0 2px 10px rgba(0,0,0,.45); }
  </style>
</head>
<body>
  <div id="frame">
    <!-- Map + scrim -->
    <div id="map" class="region" style="inset:0;z-index:0"></div>
    <div class="ds-map-scrim"></div>

    <!-- ================= TOP BAR (z20) ================= -->
    <div class="region" style="top:0;left:0;right:0;height:60px;z-index:20;display:flex;align-items:center;gap:16px;
                padding:0 18px;background:linear-gradient(180deg,rgba(8,18,34,.72),rgba(8,18,34,0))">
      <!-- logo -->
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:28px;height:28px;border-radius:7px;background:#fff;display:flex;align-items:center;justify-content:center">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="#0c1f39"><path d="M5 3h14v4h-9v4h7v4h-7v6H5z"/></svg>
        </div>
        <div style="line-height:1.15">
          <div style="font-size:12.5px;font-weight:600;color:var(--ds-ink-1)">First Sentier Group</div>
          <div style="font-size:9.5px;color:var(--ds-ink-5)">Marketing intelligence</div>
        </div>
      </div>
      <!-- conversational search -->
      <label class="ds-glass" style="display:flex;align-items:center;gap:10px;height:40px;padding:0 12px 0 14px;
             border-radius:var(--ds-r-lg);max-width:560px;flex:1;margin:0 auto">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ds-ink-5)" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <span style="flex:1;font-size:var(--ds-fs-body);color:var(--ds-ink-3)">Ask anything — “reach by market this quarter vs peers”</span>
        <span style="font-size:10px;font-weight:600;color:var(--ds-ink-5);border:1px solid var(--ds-glass-border);border-radius:5px;padding:3px 6px;font-family:var(--ds-font-mono)">⌘K</span>
      </label>
      <!-- right: live chip + date -->
      <div style="display:flex;align-items:center;gap:10px">
        <div class="ds-glass" style="display:flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:var(--ds-r-md)">
          <span style="width:7px;height:7px;border-radius:50%;background:var(--ds-positive);box-shadow:0 0 7px var(--ds-positive)"></span>
          <span style="font-size:11.5px;color:var(--ds-ink-2)">Live · 14 active</span>
        </div>
        <div style="position:relative">
          <div id="date-btn" class="ds-glass ds-tbtn" style="display:flex;align-items:center;gap:9px;height:38px;padding:0 11px;border-radius:var(--ds-r-md)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 3v3M16 3v3"/></svg>
            <div style="display:flex;flex-direction:column;line-height:1.15">
              <span class="ds-eyebrow" style="font-size:9px">Date range</span>
              <span id="date-label" style="font-size:12px;font-weight:500;color:var(--ds-ink-1)">1 Jan – 31 Dec 2026</span>
            </div>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </div>
          <!-- date popover (mock) -->
          <div id="date-pop" class="ds-glass-strong" style="display:none;position:absolute;top:46px;right:0;width:230px;
               border-radius:var(--ds-r-2xl);padding:12px;box-shadow:var(--ds-shadow-menu);z-index:30">
            <div class="ds-eyebrow" style="padding:0 4px 8px">Date range</div>
            <div class="ds-row" data-range="q" style="padding:7px 9px;font-size:12px;color:var(--ds-ink-2)">This quarter</div>
            <div class="ds-row" data-range="lastq" style="padding:7px 9px;font-size:12px;color:var(--ds-ink-2)">Last quarter</div>
            <div class="ds-row" data-range="ytd" style="padding:7px 9px;font-size:12px;color:var(--ds-ink-2)">Year to date</div>
            <div class="ds-row" data-range="12m" style="padding:7px 9px;font-size:12px;color:var(--ds-ink-2)">Last 12 months</div>
            <div class="ds-row ds-row--active" data-range="year" style="padding:7px 9px;font-size:12px;color:var(--ds-ink-1)">Full year 2026</div>
            <div style="display:flex;align-items:center;gap:8px;padding:9px 4px 2px;border-top:1px solid var(--ds-hairline);margin-top:6px">
              <span style="font-size:11px;color:var(--ds-ink-4)">Compare: prior period</span>
              <span style="margin-left:auto;width:30px;height:17px;border-radius:20px;background:var(--ds-accent-soft);border:1px solid var(--ds-accent-border);position:relative">
                <span style="position:absolute;right:2px;top:2px;width:11px;height:11px;border-radius:50%;background:var(--ds-accent)"></span></span>
            </div>
            <div style="display:flex;gap:7px;margin-top:10px">
              <span class="ds-tbtn" style="flex:1;text-align:center;font-size:11.5px;padding:7px;border-radius:var(--ds-r-md);color:var(--ds-ink-3)">Cancel</span>
              <span class="ds-cta" style="flex:1;text-align:center;font-size:11.5px;padding:7px">Apply</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ================= LEFT ICON RAIL (z17) ================= -->
    <div class="region ds-glass" style="left:16px;top:76px;z-index:17;padding:8px;border-radius:var(--ds-r-2xl);
                display:flex;flex-direction:column;gap:6px;box-shadow:var(--ds-shadow-panel)">
      <div class="rail-tbtn ds-tbtn--active" title="Map view">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 4 4 6v14l5-2 6 2 5-2V4l-5 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>
      </div>
      <div class="hairline"></div>
      <div class="rail-tbtn ds-tbtn" data-menu="brand" title="Filter by brand">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20.6 13.4l-7.2 7.2a2 2 0 01-2.8 0l-6.2-6.2V4h9.4l6.8 6.8a2 2 0 010 2.6z"/><circle cx="7.5" cy="7.5" r="1.3"/></svg>
        <span class="rail-dot"></span>
      </div>
      <div class="rail-tbtn ds-tbtn" data-menu="channel" title="Filter by channel">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="6" cy="6" r="2.4"/><circle cx="18" cy="9" r="2.4"/><circle cx="9" cy="18" r="2.4"/><path d="M8 7l8 1M8 16l8-6"/></svg>
        <span class="rail-dot"></span>
      </div>
      <div class="rail-tbtn ds-tbtn" data-menu="strategy" title="Filter by strategy">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>
        <span class="rail-dot"></span>
      </div>
      <div class="hairline"></div>
      <div class="rail-tbtn ds-tbtn" data-menu="layers" title="Map layers">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>
      </div>
    </div>

    <!-- Filter flyout (opens beside rail) -->
    <div id="flyout" class="region ds-glass" style="left:74px;top:76px;width:200px;z-index:16;display:none;
                border-radius:var(--ds-r-2xl);padding:12px 10px;box-shadow:var(--ds-shadow-menu)"></div>

    <!-- ================= TITLE + KPI (z12) ================= -->
    <div class="region" style="top:80px;left:78px;z-index:12">
      <div style="font-family:var(--ds-font-sans);font-size:var(--ds-fs-display);font-weight:300;letter-spacing:-.02em;
                  color:var(--ds-ink);text-shadow:0 2px 24px rgba(0,0,0,.55)">Data Hub</div>
      <div id="kpis" style="display:flex;gap:10px;margin-top:18px"></div>
    </div>

    <!-- ================= ZOOM STACK (z15) ================= -->
    <div class="region" style="right:18px;top:200px;z-index:15;display:flex;flex-direction:column;gap:6px">
      <div id="zoom-in" class="ds-glass ds-tbtn" style="width:36px;height:36px;border-radius:var(--ds-r-md);display:flex;align-items:center;justify-content:center;color:var(--ds-ink-2)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></div>
      <div id="zoom-out" class="ds-glass ds-tbtn" style="width:36px;height:36px;border-radius:var(--ds-r-md);display:flex;align-items:center;justify-content:center;color:var(--ds-ink-2)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg></div>
      <div id="zoom-reset" class="ds-glass ds-tbtn" style="width:36px;height:36px;border-radius:var(--ds-r-md);display:flex;align-items:center;justify-content:center;color:var(--ds-ink-2)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="7"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg></div>
    </div>

    <!-- ================= BOTTOM WIDGET RAIL (z15) ================= -->
    <div class="region" style="left:16px;right:16px;bottom:14px;z-index:15;display:flex;flex-direction:column;gap:11px">
      <div id="rail-row1"></div>
      <div id="rail-row2"></div>
    </div>
  </div>

  <script src="assets/data.js?v=20"></script>
  <script src="assets/data-live.js?v=20"></script>
  <script src="assets/app.js?v=20"></script>
</body>
</html>
